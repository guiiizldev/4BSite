services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: 4byts-pdv-sqlserver
    restart: unless-stopped
    env_file:
      - /etc/4byts-pdv/sqlserver.env
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - 4byts_pdv_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 3g
    stop_grace_period: 60s

volumes:
  4byts_pdv_sqlserver_data:
    name: 4byts_pdv_sqlserver_data
